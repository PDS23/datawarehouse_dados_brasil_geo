# Descrições das colunas do banco: o que é e de onde vem (uma frase curta). Fonte única da documentação de colunas.
# `infra/scripts/aplicar_descricoes_colunas.py` grava isto como COMMENT ON COLUMN no PostgreSQL (rodar como postgres) e o gerador do
# diagrama (`gerar_diagrama_banco.py`) lê os comentários do catálogo: o balão ao passar o mouse e o painel de detalhe mostram este texto.
#
# Regras: `padrao` vale para toda coluna com esse nome que não tenha texto próprio na tabela; o texto da tabela vence o padrão.
# `_tabela` (opcional) substitui o comentário da tabela. Para tabela nova: acrescente aqui e rode o aplicador (ver CLAUDE.md).

padrao:
  id: "Identificador interno da linha (gerado pelo banco)."
  id_fonte: "Fonte do dado: aponta para dim.fontes (rastreabilidade)."
  importado_em: "Data em que a linha foi gravada pelo pipeline."
  geom: "Geometria em SIRGAS 2000 (EPSG:4674)."
  geom_anomala: "true = a fonte entregou a geometria fora do Brasil ou vazia; o original está em geom_origem_texto."
  geom_origem_texto: "Geometria original da fonte em texto, guardada só quando geom_anomala é true."
  vigente_desde: "Data em que esta versão da linha passou a valer (espelho versionado)."
  vigente_ate: "Data em que esta versão deixou de valer. NULL = versão vigente."
  reaberto_em: "Data em que a fonte republicou a linha idêntica a esta versão e ela voltou a vigorar. NULL = nunca reaberta."
  coletado_em: "Momento (UTC) da coleta em que esta versão entrou."
  id_carga: "Execução do pipeline que gravou a linha: aponta para catalogo.cargas."
  id_estado: "UF: aponta para dim.estados (código IBGE de 2 dígitos)."
  id_municipio: "Município: aponta para dim.municipios (código IBGE de 7 dígitos)."
  id_bioma: "Bioma: aponta para dim.biomas."
  sigla_uf: "Sigla da UF (SP, MT...), vinda do IBGE."
  area_km2: "Área em km² calculada pelo IBGE ou por nós a partir da geometria."
  ano_malha: "Ano da malha territorial do IBGE da geometria atual."
  edicao: "Edição publicada pela fonte (vAAAAMMDD) em que esta versão entrou."
  nome: "Nome como a fonte escreve."
  slug: "Nome sem acento e com sublinhados, para usar em comandos e filtros."
  dataset: "Dataset (schema.tabela) a que o registro se refere."
  recorte: "Pedaço coletado do dataset (UF, bioma, produto...)."

