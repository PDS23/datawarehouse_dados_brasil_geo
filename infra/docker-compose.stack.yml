# Stack completa (PostGIS + GeoServer) para o desktop definitivo.
# Os valores de memoria abaixo foram dimensionados para o desktop de
# 32 GB de RAM com o WSL2 limitado a 20 GB (.wslconfig); ajustar se a
# maquina for outra. Quando a migracao terminar, este arquivo passa a ser o
# docker-compose.yml (o atual serve o GeoServer do notebook).
#
# Uso (a partir da pasta infra/, com .env preenchido):
#   docker compose -f docker-compose.stack.yml up -d
name: data-warehouse

services:
  postgis:
    image: postgis/postgis:18-3.6        # PostgreSQL 18.6 + PostGIS 3.6.x
    container_name: dw-postgis
    restart: unless-stopped
    shm_size: 2gb                        # /dev/shm: consultas paralelas usam; o padrao (64 MB) e pouco
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      # POSTGRES_DB fica de proposito sem valor: a imagem instala
      # postgis_topology e tiger_geocoder no banco que cria. O banco
      # data_warehouse e criado vazio na migracao (so postgis + unaccent).
    ports:
      # Padrao 127.0.0.1 (so esta maquina).
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado, NUNCA pasta do projeto (Google Drive/OneDrive nao
      # podem sincronizar arquivos do banco em uso). No Postgres 18 a
      # imagem guarda os dados em /var/lib/postgresql/18/docker, entao o
      # volume e montado em /var/lib/postgresql (e nao em .../data).
      - pgdata:/var/lib/postgresql
      # Dump a restaurar (somente leitura). Pasta criada na migracao.
      - ../_dump:/dump:ro
      # Regras de entrada do banco (pg_hba), no repositorio. Montado FORA do
      # PGDATA: um arquivo dentro do PGDATA quebra o initdb de um volume vazio.
      # Ver infra/postgres/LEIAME_pg_hba.md.
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=10GB
      - -c
      - maintenance_work_mem=2GB          # acelera CREATE INDEX (GIST) no restore
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=on
      - -c
      - max_worker_processes=12
      - -c
      - max_parallel_workers=12
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_maintenance_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    container_name: dw-geoserver
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      # Padrao 127.0.0.1 (so esta maquina). Pra expor na tailnet, definir
      # GEOSERVER_BIND_IP no .env com o IP Tailscale da maquina.
      - "${GEOSERVER_BIND_IP:-127.0.0.1}:${GEOSERVER_PORT:-8080}:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?defina GEOSERVER_ADMIN_PASSWORD no arquivo .env}
      EXTRA_JAVA_OPTS: "-Xms512m -Xmx2g"
    volumes:
      - geoserver_data:/opt/geoserver_data
      # Rasters lidos direto do disco, somente leitura.
      - ../mapbiomas/uso_do_solo/processado:/rasters/mapbiomas:ro
      - ../elevacao/topodata/processado:/rasters/topodata:ro
    # Nesta stack o GeoServer fala com o banco pelo nome do servico
    # ("postgis"): GEOSERVER_DB_HOST=postgis no .env.

volumes:
  pgdata:
  geoserver_data:
