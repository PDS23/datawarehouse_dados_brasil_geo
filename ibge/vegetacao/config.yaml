# Pipeline de Vegetação (BDiA, IBGE, 1:250.000). Configuracao versionada.
# Fonte: servidor de arquivos do IBGE (geoftp). A pasta `vegetacao/vetores/escala_250_mil/` tem uma subpasta por edicao (versao_AAAA/); o pipeline descobre a mais recente pela listagem do diretorio
# e baixa `vege_area.zip` (shapefile de poligonos), sem arquivo manual. A mecanica e comum aos 4 temas do BDiA: scripts_comuns/dwlib/bdia.py.
fonte: IBGE                        # nome exato em dim.fontes
titulo: Vegetação
pasta: ibge/vegetacao
url_base: "https://geoftp.ibge.gov.br/informacoes_ambientais/vegetacao/vetores/escala_250_mil/"
arquivo: vege_area.zip
destino_padrao: vetorial.ibge_vegetacao
chave: id1                         # id da feicao no shapefile (unico em cada edicao)
srid_gravado: 4674                 # o shapefile ja vem em SIRGAS 2000
tamanho_minimo_bytes: 150000000  # o zip tem 350 a 500 MB; menos que isto = download truncado ou arquivo errado
linhas_minimas: 100000
lote_leitura: 10000                # feicoes por leitura (o .shp tem mais de 1 GB descompactado)
max_queda: 0.10
caixa_brasil: {lon_min: -75.0, lon_max: -25.0, lat_min: -36.0, lat_max: 7.0}
licenca: "Dados abertos do IBGE (BDiA); confirmar os termos de uso e a citacao exigida antes de redistribuir"
colunas:                           # coluna do banco (= campo do shapefile em minusculas) -> tipo
  id1: bigint
  cd_fcim: text
  leg_carga: text
  cd_fito: text
  cd_leg_2: text
  clas_domi: text
  leg_uveg: text
  nm_uveg: text
  leg_uantr: text
  nm_uantr: text
  leg_contat: text
  nm_contat: text
  veg_pretet: text
  nm_pretet: text
  leg_sec1: text
  nm_sec1: text
  leg_sec2: text
  nm_sec2: text
  leg_sup: text
  legenda_1: text
  legenda_2: text
  legenda: text
  ar_poli_km: numeric
  leg1_id: integer
  leg2_id: integer
