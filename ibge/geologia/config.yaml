# Pipeline de Geologia (BDiA, IBGE, 1:250.000). Configuracao versionada.
# Fonte: servidor de arquivos do IBGE (geoftp). A pasta `geologia/levantamento_geologico/vetores/escala_250_mil/` tem uma subpasta por edicao (versao_AAAA/); o pipeline descobre a mais recente pela listagem do diretorio
# e baixa `geol_area.zip` (shapefile de poligonos), sem arquivo manual. A mecanica e comum aos 4 temas do BDiA: scripts_comuns/dwlib/bdia.py.
fonte: IBGE                        # nome exato em dim.fontes
titulo: Geologia
pasta: ibge/geologia
url_base: "https://geoftp.ibge.gov.br/informacoes_ambientais/geologia/levantamento_geologico/vetores/escala_250_mil/"
arquivo: geol_area.zip
destino_padrao: vetorial.ibge_geologia
chave: id1                         # id da feicao no shapefile (unico em cada edicao)
srid_gravado: 4674                 # o shapefile ja vem em SIRGAS 2000
tamanho_minimo_bytes: 150000000  # o zip tem 350 a 500 MB; menos que isto = download truncado ou arquivo errado
linhas_minimas: 100000
lote_leitura: 10000                # feicoes por leitura (o .shp tem mais de 1 GB descompactado)
max_queda: 0.10
caixa_brasil: {lon_min: -75.0, lon_max: -25.0, lat_min: -36.0, lat_max: 7.0}
licenca: "Dados abertos do IBGE (BDiA); confirmar os termos de uso e a citacao exigida antes de redistribuir"
colunas:                           # coluna do banco (= campo do shapefile em minusculas) -> tipo
  id1: bigint
  ordem: integer
  cd_fcim: text
  leg_carga: text
  id_unidade: integer
  nm_unidade: text
  letra_simb: text
  nm_lito1: text
  nm_lito2: text
  nm_lito3: text
  nm_lito4: text
  ar_poli_km: numeric
  nm_tempo_g: text
  nm_provinc: text
  nm_sub_pro: text
  cd_prov_id: integer
  cd_sub_pro: integer
  nm_tp_roc: text
  nm_stp_roc: text
